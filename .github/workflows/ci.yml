name: CI

# Kører ved hver pull request og hvert push til main.
on:
  pull_request:
  push:
    branches: [main]

# Workflowet må kun læse koden (mindste rettigheder).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # De samme kommandoer, som man kører lokalt.
      - name: Opret virtuelt miljø og installér værktøjer
        run: make setup

      - name: Lint og test
        run: make check
